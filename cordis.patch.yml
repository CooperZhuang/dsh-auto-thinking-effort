# dsh-auto-thinking-effort bundle patch
#
# This file is the `dsh.bundle.patch` layer of the published npm package. When
# the plugin is installed through the official CLI —
#
#   dsh plugin --profile <name> add dsh-auto-thinking-effort@<version>
#
# — the command reconciles `dsh.profile.bundles` against installed packages and,
# seeing this declaration, appends `dsh-auto-thinking-effort` to the bundle
# stack. Profile boot then merges THIS patch exactly like a hand-written mount
# line, so one command installs and mounts.
#
# ── What the row does ────────────────────────────────────────────────────────
#
# It mounts on the HOST plane and registers:
#
#   * a synthetic **Auto** gear in every route that advertises efforts
#     (`ctx.llm.resolveModelInfo` / `resolveCallConfig` wrappers, see
#     src/capability.ts), so the model picker shows `Auto, off, low, high, max`;
#   * `agent/pre-step`  — classify the turn's user message into a level;
#   * `agent/request`   — turn the Auto gear into a real effort for that turn.
#
# Host plane is the correct place for all three. The listeners are dispatch
# seams, not realm services: `agent/pre-step` and `agent/request` are
# scope-filtered events, so a root-plane listener observes every agent (and
# every subagent) without joining any isolate. The gear wrappers only touch the
# live `llm` service instance; `prepareCall` is deliberately left unpatched so a
# gear id that outlives the plugin fails loudly instead of reaching a provider.
#
# ── How a user drives it ─────────────────────────────────────────────────────
#
# | Session selection        | Behaviour                                  |
# |--------------------------|--------------------------------------------|
# | `Auto` (the gear)        | this plugin decides every turn             |
# | no explicit effort       | this plugin decides every turn (`autoWhenUnset`) |
# | `off`/`low`/`high`/`max` | untouched — a manual choice always wins    |
#
# A manual gear therefore needs no extra mechanism: the plugin only acts when
# the request asks for the gear (or carries no effort at all). Set
# `autoWhenUnset: false` to make "no effort" mean the provider default instead.
#
# The gear must never reach a provider: `agent/request` substitutes it before
# `prepareCall` runs. If the plugin is disabled while a session still selects
# Auto, the sanitizer below (registered even when disabled) still replaces it.
#
# ── Scope of the change ─────────────────────────────────────────────────────
#
# Only `reasoningEffort` is touched. Provider, model, prompt, and message list
# are never modified, so a decision can at worst cost a different amount of
# thinking, never a different conversation.
#
# ── Configuring it ──────────────────────────────────────────────────────────
#
# The `config:` block below is the **composition base layer**. The plugin also
# registers a settings namespace with the same name, so the knobs can be set in
# a settings file instead:
#
#   # ~/.dsh/settings.yaml
#   auto-thinking-effort:
#     autoCeilingLevel: max
#     classifier: model
#     classifierModel: deepseek-official/deepseek-v4-flash
#
# Resolution order is schema defaults → this base layer → the settings user
# layer, and the namespace is registered with `applies: live`: an edit there is
# picked up on the running host (watch + re-validate), with a log line reading
# `reconfigured from auto-thinking-effort — …`. An invalid edit keeps the last
# good configuration and warns instead of stranding the session. A profile row
# override replaces this whole `config:` block, so put user preferences in the
# settings file rather than restating every key in the profile patch.
# thinking, never a different conversation.
- insert:
    - id: auto-thinking-effort
      name: 'dsh-auto-thinking-effort'
      config:
        enabled: true
        # Decide and log every turn, but never rewrite the request. Useful for
        # a first look at a real session before trusting the classifier.
        dryRun: false
        # Subagents carry their own route and effort chosen by the caller;
        # leave them alone unless you deliberately want them classified too.
        # An inherited Auto gear is still resolved (it must not reach a provider).
        applyToSubagents: false
        # The synthetic picker entry.
        autoEffortId: auto
        autoEffortName: Auto
        autoEffortDescription: 每轮按提问自动选择档位
        # Weakest rung auto may resolve to. `minimal` = the ladder's weakest
        # level, i.e. no floor: auto may turn thinking off. Raise it to `low` if
        # you would rather auto never switch thinking off.
        autoFloorLevel: minimal
        # Score-derived decisions stay one rung below the top; only an explicit
        # pin (`ultrathink` / `深入思考`) reaches `max`.
        autoCeilingLevel: high
        # Which backend decides the level: the shipped heuristics (default), or a
        # cheap model call that reads the request and answers with one level id.
        # The model backend always falls back to the heuristic decision on any
        # failure, so it can never fail a turn.
        classifier: heuristic
        # Route for that call, `provider/model`; empty reuses the agent's own
        # route at request time. Point it at a small, fast model.
        classifierModel: ''
        classifierTimeoutMs: 8000
        classifierMaxTokens: 64
